; Updated PlatformIO config — ensure QTRSensors is available for esp32dev
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = pololu/QTRSensors@^4.0.0
monitor_speed = 115200
upload_speed = 115200

[env:my_build_env]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = pololu/QTRSensors@^4.0.0

